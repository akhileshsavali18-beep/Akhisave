r-radius:50%;object-fit:cover;padding:4px;background:linear-gradient(#0b111d,#0b111d) padding-box,linear-gradient(135deg,var(--p),var(--pk),var(--or)) border-box}.username{font-size:27px;font-weight:950}.verified{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:50%;background:#4387f4;font-size:10px}.fullname{margin:6px 0;color:#d7deea;font-weight:750}.bio{color:#8b97aa;white-space:pre-line;line-height:1.55}.stats{display:flex;gap:30px;margin:18px 0}.stats b{display:block;font-size:19px}.stats span{font-size:10px;color:#758197}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{display:inline-grid;place-items:center;min-height:43px;padding:0 15px;border-radius:12px;border:1px solid #ffffff12;background:#ffffff06;text-decoration:none;font-size:11px;font-weight:900;color:#dce2ec}.primary{border:0;background:linear-gradient(135deg,var(--p),var(--pk));color:#fff}.section{margin-top:16px}.section h2{margin:0 0 13px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.media{overflow:hidden;border:1px solid #ffffff0b;border-radius:15px;background:#080c14}.media img,.media video{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#05070b}.mediafoot{padding:9px;display:flex;justify-content:space-between;gap:8px;font-size:9px;color:#7f8ba0}.mediafoot a{font-weight:850;text-decoration:none;color:#c9bdff}.media-actions{display:flex;gap:8px;margin-top:9px}.media-actions a{flex:1}.note{margin-top:12px;padding:12px;border:1px solid #ffffff0d;border-radius:13px;color:#7e899d;font-size:10px;line-height:1.5}.footer{text-align:center;color:#626e82;font-size:10px;padding:25px 0}.footer a{margin:0 7px}.download{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px}.preview{background:#05070b;border:1px solid #ffffff08;border-radius:17px;overflow:hidden;min-height:300px;display:grid;place-items:center}.preview img,.preview video{width:100%;max-height:650px;object-fit:contain;display:block}.side{display:flex;flex-direction:column;gap:9px}.meta{padding:12px;border:1px solid #ffffff0b;background:#ffffff05;border-radius:12px;color:#8995aa;font-size:10px;line-height:1.55}.meta b{color:#e8ecf4}.empty{padding:45px;text-align:center;color:#8793a8}@media(max-width:650px){.nav{height:62px}.brand img{width:38px;height:38px}.brand{font-size:19px}.wrap{padding:23px 13px 55px}.title{font-size:27px}.card{padding:15px;border-radius:18px}.profile{grid-template-columns:1fr;text-align:center;gap:15px}.avatar{width:145px;height:145px;margin:auto}.username{font-size:23px}.stats{justify-content:center;gap:22px}.actions{justify-content:center}.grid{grid-template-columns:repeat(2,1fr)}.download{grid-template-columns:1fr}.preview{min-height:240px}}

<body>
<header class="nav"><div class="navin"><a class="brand" href="/"><img src="/akhisave-mark.svg" alt="AkhiSave"><span>AkhiSave</span></a><a class="back" href="/">← All tools</a></div></header>
<main class="wrap"><div class="crumb" id="crumb">AkhiSave / Result</div><h1 class="title" id="title">Your result</h1><p class="sub" id="sub">Processing public Instagram content…</p><div class="ad">ADVERTISEMENT</div><div id="out"><div class="card loader"><div class="spin"></div>Preparing your result…</div></div><div class="ad">ADVERTISEMENT</div><div class="footer"><div>AkhiSave © 2026</div><div><a href="/privacy">Privacy</a><a href="/terms">Terms</a><a href="/dmca">DMCA</a><a href="/contact">Contact</a></div></div></main>
<script>
const params=new URLSearchParams(location.search),tool=params.get('tool')||'photo',url=params.get('url')||'';const out=document.getElementById('out'),title=document.getElementById('title'),sub=document.getElementById('sub'),crumb=document.getElementById('crumb');
const names={photo:'Photo Downloader',reels:'Reels Downloader',video:'Video Downloader',profile:'Profile Viewer',dp:'DP Viewer',posts:'Profile Posts',reelFeed:'Profile Reels'};title.textContent=names[tool]||'AkhiSave Result';crumb.textContent='AkhiSave / '+(names[tool]||'Result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pick(d,...ks){for(const k of ks){const v=k.split('.').reduce((a,x)=>a?.[x],d);if(v!==undefined&&v!==null&&v!=='')return v}return''}function deep(d,keys){for(const k of keys){const v=pick(d,k);if(v)return v}return''}function fmt(n){if(n===undefined||n===null||n==='')return'—';const x=Number(n);return Number.isFinite(x)?Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(x):esc(n)}function fail(t){out.innerHTML='<div class="card error"><b>Couldn’t complete that request.</b><br><span>'+esc(t)+'</span><div style="margin-top:15px"><a class="btn primary" href="/">Choose another tool</a></div></div>'}async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw new Error(d.error||d.message||'The service could not process this URL.');return d}
function renderProfile(d,dp){const a=d.author||d.profile||d;const avatar=deep(a,['avatar','profilePicture','profilePic','profilePhoto','profile_picture','avatarUrl','image','imageUrl','picture','photo'])||deep(d,['avatar','profilePicture','profilePic','profilePhoto','profile_picture','avatarUrl','image','imageUrl','picture','photo']);const user=deep(a,['username','userName','handle','screenName']);const name=deep(a,['displayName','fullName','name','nickname']);const bio=deep(a,['bio','description']);const followers=deep(a,['followers','followerCount','followersCount']);const following=deep(a,['following','followingCount']);const posts=deep(a,['posts','postCount','postsCount']);const verified=!!deep(a,['verified','isVerified','verification']);const ig=pick(a,'profileUrl','url')||('https://www.instagram.com/'+encodeURIComponent(user||''));if(dp){out.innerHTML='<div class="card"><div class="profile"><div>'+ (avatar?'<img class="avatar" src="'+esc(avatar)+'" alt="Instagram profile picture">':'<div class="avatar" style="display:grid;place-items:center;color:#68758b">No image</div>') +'</div><div><div class="username">@'+esc(user||'instagram')+'</div><p class="sub">Public Instagram profile picture</p><div class="actions">'+(avatar?'<a class="btn primary" href="'+esc(avatar)+'" target="_blank" rel="noopener">Open HD picture</a><a class="btn" href="'+esc(avatar)+'" download>Save picture</a>':'')+'<a class="btn" href="'+esc(ig)+'" target="_blank" rel="noopener">Open Instagram</a></div></div></div></div>';return}out.innerHTML='<div class="card"><div class="profile"><div>'+ (avatar?'<img class="avatar" src="'+esc(avatar)+'" alt="@'+esc(user)+'">':'<div class="avatar" style="display:grid;place-items:center;color:#68758b">No image</div>') +'</div><div><div class="username">@'+esc(user||'unknown')+(verified?'<span class="verified">✓</span>':'')+'</div><div class="fullname">'+esc(name)+'</div><div class="bio">'+esc(bio)+'</div><div class="stats"><div><b>'+fmt(posts)+'</b><span>posts</span></div><div><b>'+fmt(followers)+'</b><span>followers</span></div><div><b>'+fmt(following)+'</b><span>following</span></div></div><div class="actions"><a class="btn primary" href="'+esc(ig)+'" target="_blank" rel="noopener">Open Instagram</a><a class="btn" href="/result.html?tool=dp&url='+encodeURIComponent(url)+'">View DP</a><a class="btn" href="/result.html?tool=posts&url='+encodeURIComponent(url)+'">View Posts</a><a class="btn" href="/result.html?tool=reelFeed&url='+encodeURIComponent(url)+'">View Reels</a></div></div></div></div>'}
function renderMedia(d){let medias=Array.isArray(d.medias)?d.medias:[];if(!medias.length){const u=pick(d,'downloadUrl','videoUrl','imageUrl','mediaUrl','url');if(u)medias=[{url:u,thumbnail:pick(d,'thumbnail','imageUrl'),type:tool==='photo'?'image':'video'}]}if(!medias.length){out.innerHTML='<div class="card empty">No downloadable media URL was returned.</div>';return}let h='<div class="card"><div class="sectionhead"><h2>Ready to save</h2><p class="sub">Temporary media links can expire, so save the file promptly.</p></div><div class="grid">';for(const m of medias){const u=pick(m,'url','downloadUrl','videoUrl','imageUrl','src');const t=pick(m,'thumbnail','image','imageUrl','displayUrl')||u;const v=/video|reel|mp4/i.test(String(pick(m,'type','contentType','format')||tool));h+='<div class="media">'+(v?'<video controls playsinline poster="'+esc(t)+'" src="'+esc(u)+'"></video>':'<img loading="lazy" src="'+esc(t)+'" alt="Instagram media">')+'<div class="mediafoot"><span>'+esc(pick(m,'label','quality','format')||'Media')+'</span>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">Open</a>':'')+'</div>'+(u?'<div class="media-actions"><a class="btn primary" href="'+esc(u)+'" target="_blank" rel="noopener">Download</a></div>':'')+'</div>'}h+='</div></div>';
if(medias.length>1)h+='<div class="note">This result contains multiple public media items. Open or download each item separately.</div>';out.innerHTML=h}
function renderFeed(items,label){if(!Array.isArray(items)||!items.length){out.innerHTML='<div class="card empty">No public '+esc(label.toLowerCase())+' were returned for this profile.</div>';return}let h='<div class="card"><h2>'+esc(label)+'</h2><p class="sub">Public Instagram media from this profile.</p><div class="grid">';for(const x of items){const u=deep(x,['videoUrl','downloadUrl','url','mediaUrl','imageUrl','src','displayUrl']);const t=deep(x,['thumbnail','cover','image','imageUrl','displayUrl'])||u;const v=/video|reel|mp4/i.test(String(deep(x,['contentType','type'])||''))||!!pick(x,'videoUrl');h+='<div class="media">'+(v?'<video controls muted playsinline poster="'+esc(t)+'" src="'+esc(pick(x,'videoUrl','url','downloadUrl')||u)+'"></video>':'<img loading="lazy" src="'+esc(t)+'" alt="Instagram post">')+'<div class="mediafoot"><span>'+esc(pick(x,'contentType','type')||'media')+'</span>'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">Open</a>':'')+'</div></div>'}h+='</div></div>';out.innerHTML=h}
async function run(){if(!url){fail('No Instagram URL was supplied.');return}try{let d;if(tool==='profile'||tool==='dp')d=await api('/api/instagram/profile',{url});else if(tool==='posts')d=await api('/api/instagram/posts',{url});else if(tool==='reelFeed')d=await api('/api/instagram/reels',{url});else d=await api('/api/download',{url,tool});if(tool==='profile')renderProfile(d.data||d,false);else if(tool==='dp')renderProfile(d.data||d,true);else if(tool==='posts')renderFeed(d.data?.items||d.data?.posts||d.items||[],'Profile Posts');else if(tool==='reelFeed')renderFeed(d.data?.items||d.data?.reels||d.items||[],'Profile Reels');else renderMedia(d.data||d);sub.textContent='Public Instagram result · '+(names[tool]||'Tool')}catch(e){fail(e.message||e)}}run();
</script>
