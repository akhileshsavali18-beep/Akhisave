<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoClip API Check | AkhiSave</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#172033;margin:0;padding:24px}.card{max-width:620px;margin:8vh auto;background:#fff;border:1px solid #e5e8ee;border-radius:18px;padding:24px;box-shadow:0 10px 30px #0000000d}button{border:0;border-radius:10px;padding:12px 16px;background:#172033;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:18px;padding:14px;border-radius:12px;background:#f3f5f9;white-space:pre-wrap;word-break:break-word}.muted{color:#6b7280}.ok{color:#18753c;font-weight:800}.bad{color:#b42318;font-weight:800}
</style>
</head>
<body>
<div class="card">
<h1>SoClip API Diagnostic</h1>
<p class="muted">This checks the same AkhiSave server route used by the downloader. It does not expose your API key.</p>
<button id="test">Test SoClip API</button>
<div id="result" class="result">Not tested yet.</div>
</div>
<script>
const TEST_URL='https://www.instagram.com/reel/Cx8pLh9sD4A/';
const result=document.getElementById('result');
document.getElementById('test').onclick=async()=>{
 result.textContent='Testing…';
 try{
  const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:TEST_URL})});
  const text=await r.text();
  let data;try{data=JSON.parse(text)}catch{data={raw:text}}
  const msg=data?.error||data?.message||data?.raw||'No message returned.';
  result.innerHTML='<div class="'+(r.ok?'ok':'bad')+'">HTTP '+r.status+(r.ok?' — SUCCESS':' — FAILED')+'</div><br>'+escapeHtml(JSON.stringify({status:r.status,message:msg},null,2));
 }catch(e){result.innerHTML='<div class="bad">Request failed</div><br>'+escapeHtml(String(e));}
};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
