name: Fix AkhiSave Ad Layout
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace Monetag injection with Adsterra banner slots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('worker-wrapper.js')
          s=p.read_text()
          # Remove the currently injected Monetag/Vignette/Direct-Link ad scripts.
          s=re.sub(r'const ads=`.*?`;let out=', '''const ads=`<div class="akhisave-ad-top"><script>atOptions={"key":"b5f10b469c2566d06ff288ac7dc9b5b2","format":"iframe","height":250,"width":300,"params":{}};</script><script src="https://www.highrevenueformat.com/b5f10b469c2566d06ff288ac7dc9b5b2/invoke.js"></script></div>`;let out=''', s, count=1, flags=re.S)
          # Remove any old IPP zone script from the original homepage and wrapper replacement.
          s=re.sub(r'<script>\(function\(s\)\{s\.dataset\.zone=[^<]+?</script>', '', s)
          s=s.replace('replace(/11717101/g,"11727439");','')
          # Add a second 300x250 slot in the existing advertisement placeholder and a top slot after header.
          old='out=out.replace(/(<link[^>]+rel=[\\"\'](?:icon|shortcut icon)[\\"\'][^>]+href=[\\"\'])[^\\"\']+/i,"$1"+icon)'
          marker='out=out.replace(/(<link[^>]+rel=[\\"\'](?:icon|shortcut icon)[\\"\'][^>]+href=[\\"\'])[^\\"\']+/i,"$1"+icon)'
          inject='out=out.replace(/(<link[^>]+rel=[\\"\'](?:icon|shortcut icon)[\\"\'][^>]+href=[\\"\'])[^\\"\']+/i,"$1"+icon).replace(/(<div class=[\\"\']ad[\\"\'][^>]*>.*?<\\/div>)/is,`<div class="akhisave-ad-middle"><script>atOptions={"key":"b5f10b469c2566d06ff288ac7dc9b5b2","format":"iframe","height":250,"width":300,"params":{}};</script><script src="https://www.highrevenueformat.com/b5f10b469c2566d06ff288ac7dc9b5b2/invoke.js"></script></div>`);'
          if marker in s:
              s=s.replace(marker,inject,1)
          s=s.replace('out=out.replace(/<\\/head>/i,ads+css+"</head>");','out=out.replace(/<\\/head>/i,css+"</head>");')
          # Put the top banner immediately after the public header on every page.
          s=s.replace('out=out.replace(/<\\/head>/i,css+"</head>");','out=out.replace(/(<header[^>]*>.*?<\\/header>)/is,$1+ads);')
          # Remove any old ad scripts that might remain in HTML after wrapper processing.
          s=s.replace('const ads=`<script>(function(s){s.dataset.zone=\'11727439\';s.src=\'https://nap5k.com/tag.min.js\'})(document.documentElement.appendChild(document.createElement(\'script\')))</script>`;','')
          p.write_text(s)
          PY
      - name: Validate and self delete
        run: |
          node --check worker-wrapper.js
          rm -f .github/workflows/fix-adsterra-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-wrapper.js .github/workflows/fix-adsterra-layout.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Use Adsterra banner layout instead of popup ads'
          git push
