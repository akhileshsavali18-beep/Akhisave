name: Upgrade Admin Tools
on:
  push:
    paths:
      - .github/workflows/upgrade-admin-tools.yml
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade worker and admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker.js'); s=p.read_text()
          marker='    if (url.pathname === "/api/admin/settings") {'
          insert='''    if (url.pathname === "/api/admin/tools") {\n      if (!(await isAdmin(request, env))) return json({ success: false, error: "Unauthorized" }, 401);\n      if (!env.AKHISAVE_SETTINGS) return json({ success: false, error: "Settings storage is not connected yet." }, 503);\n      if (request.method === "GET") return json({ success: true, tools: await getCustomTools(env) });\n      if (request.method === "PUT") {\n        try {\n          const body = await request.json();\n          const tools = sanitizeCustomTools(body.tools);\n          await env.AKHISAVE_SETTINGS.put("custom_tools", JSON.stringify(tools));\n          return json({ success: true, tools });\n        } catch { return json({ success: false, error: "Could not save tools." }, 400); }\n      }\n      return json({ success: false, error: "Method not allowed" }, 405);\n    }\n\n'''
          if '/api/admin/tools' not in s:
              s=s.replace(marker,insert+marker)
          marker2='    if (url.pathname === "/api/site-config") return json({ success: true, settings: await getSettings(env) });'
          repl='    if (url.pathname === "/api/site-config") return json({ success: true, settings: await getSettings(env), tools: await getCustomTools(env) });'
          s=s.replace(marker2,repl)
          helper='''\nasync function getCustomTools(env) {\n  const defaults = [\n    { id: "photo-crop", name: "Image Crop", icon: "✂️", type: "image-crop", enabled: false, description: "Crop an image directly in your browser." },\n    { id: "image-pdf", name: "Image to PDF", icon: "📄", type: "image-pdf", enabled: false, description: "Turn an image into a downloadable PDF." },\n    { id: "image-compress", name: "Image Compressor", icon: "🗜️", type: "image-compress", enabled: false, description: "Compress an image before downloading." }\n  ];\n  if (!env.AKHISAVE_SETTINGS) return defaults;\n  try { const raw=await env.AKHISAVE_SETTINGS.get("custom_tools"); return raw ? sanitizeCustomTools(JSON.parse(raw)) : defaults; } catch { return defaults; }\n}\n\nfunction sanitizeCustomTools(input) {\n  const allowed = new Set(["image-crop","image-pdf","image-compress","url-downloader"]);\n  if (!Array.isArray(input)) return [];\n  return input.slice(0,50).map((x,i)=>({\n    id: cleanText(x?.id || `tool-${i+1}`,50).replace(/[^a-zA-Z0-9_-]/g,"-"),\n    name: cleanText(x?.name || "Custom Tool",50),\n    icon: cleanText(x?.icon || "🧰",8),\n    type: allowed.has(x?.type) ? x.type : "image-crop",\n    enabled: x?.enabled !== false,\n    description: cleanText(x?.description || "AkhiSave utility tool.",160),\n    button: cleanText(x?.button || "Start",30),\n    placeholder: cleanText(x?.placeholder || "Choose a file",120)\n  }));\n}\n'''
          if 'function getCustomTools' not in s:
              s=s.replace('async function getSettings(env) {',helper+'\nasync function getSettings(env) {')
          p.write_text(s)

          p=Path('admin.html'); s=p.read_text()
          old='''    <div class="section card">\n      <h2>Instagram Tools</h2>'''
          new='''    <div class="section card">\n      <h2>Tool Manager</h2>\n      <p class="muted small">Add, edit, enable or delete tools from this panel. Built-in tool templates run without exposing API keys.</p>\n      <div id="toolList"></div>\n      <div class="actions"><button id="addTool" class="btn">＋ Add New Tool</button></div>\n      <div id="toolEditor" class="notice" style="display:none"></div>\n    </div>\n\n    <div class="section card">\n      <h2>Instagram Tools</h2>'''
          s=s.replace(old,new)
          s=s.replace('<div class="grid">\n      <div class="card"><div class="muted">Website</div><div class="stat">Online</div><div class="pill">akhisave.online</div></div>','<div class="grid">\n      <div class="card"><div class="muted">Website</div><div class="stat">Online</div><div class="pill">akhisave.online</div></div>')
          js='''\nlet customTools=[];\nasync function loadTools(){const r=await api('/api/admin/tools');if(r.ok){customTools=r.data.tools||[];renderTools()}}\nfunction renderTools(){const box=document.getElementById('toolList');box.innerHTML=customTools.length?customTools.map((t,i)=>`<div class="row"><div><b>${escapeText(t.icon)} ${escapeText(t.name)}</b><div class="muted small">${escapeText(t.description)} · ${escapeText(t.type)}</div></div><div class="actions"><input class="switch" type="checkbox" ${t.enabled?'checked':''} onchange="toggleTool(${i},this.checked)"><button class="btn secondary" onclick="editTool(${i})">Edit</button><button class="btn secondary" onclick="deleteTool(${i})">Delete</button></div></div>`).join(''):'<div class="empty">No custom tools yet. Tap ＋ Add New Tool.</div>'}\nfunction escapeText(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}\nfunction editTool(i){const t=customTools[i];const e=document.getElementById('toolEditor');e.style.display='block';e.innerHTML=`<b>Edit Tool</b><div class="field"><label>Name</label><input id="teName" value="${escapeText(t.name)}"></div><div class="field"><label>Icon</label><input id="teIcon" value="${escapeText(t.icon)}"></div><div class="field"><label>Type</label><select id="teType"><option value="image-crop">Image Crop</option><option value="image-pdf">Image to PDF</option><option value="image-compress">Image Compressor</option><option value="url-downloader">URL Downloader</option></select></div><div class="field"><label>Description</label><input id="teDesc" value="${escapeText(t.description)}"></div><div class="actions"><button class="btn save" onclick="saveTool(${i})">Save Tool</button><button class="btn secondary" onclick="cancelToolEdit()">Cancel</button></div>`;document.getElementById('teType').value=t.type}\nfunction addTool(){customTools.push({id:'tool-'+Date.now(),name:'New Tool',icon:'🧰',type:'image-crop',enabled:true,description:'New AkhiSave utility tool.',button:'Start',placeholder:'Choose a file'});editTool(customTools.length-1)}\nfunction saveTool(i){const t=customTools[i];t.name=document.getElementById('teName').value;t.icon=document.getElementById('teIcon').value;t.type=document.getElementById('teType').value;t.description=document.getElementById('teDesc').value;persistTools()}\nfunction toggleTool(i,v){customTools[i].enabled=v;persistTools()}\nfunction deleteTool(i){if(confirm('Delete this tool?')){customTools.splice(i,1);persistTools()}}\nasync function persistTools(){const r=await api('/api/admin/tools',{method:'PUT',body:JSON.stringify({tools:customTools})});if(r.ok){customTools=r.data.tools||[];renderTools();cancelToolEdit();toast('Tools saved')}else toast(r.data.error||'Could not save tools')}\nfunction cancelToolEdit(){const e=document.getElementById('toolEditor');e.style.display='none';e.innerHTML=''}\ndocument.getElementById('addTool').addEventListener('click',addTool);\n'''
          s=s.replace("loadSession();async function loadSession(){",js+"loadSession();async function loadSession(){")
          s=s.replace("if(r.ok)showAdmin();else showLogin()","if(r.ok){showAdmin();loadTools()}else showLogin()")
          p.write_text(s)
          PY
      - name: Self delete workflow
        run: |
          rm .github/workflows/upgrade-admin-tools.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add worker.js admin.html .github/workflows/upgrade-admin-tools.yml
          git commit -m "Add customizable admin tool manager" || exit 0
          git push
