name: One-time DP Viewer fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            '<button class="tab" data-type="profile"><i>👤</i>Profile</button>':'<button class="tab" data-type="dp"><i>👤</i>DP Viewer</button>',
            'Profile tab with profile URL support':'DP Viewer with Instagram profile URL support',
            'Profile picture preview when profile data is available':'View and download Instagram profile picture (DP)',
            'Choose Photo, Reels, Video, Story or Profile.':'Choose Photo, Reels, Video, Story or DP Viewer.',
            'Photo, Reels, Video, Story or Profile':'Photo, Reels, Video, Story or DP Viewer',
            "profile:['Profile Viewer','View a public Instagram profile by URL.','Paste Instagram profile URL...','View Profile']":"dp:['DP Viewer','View an Instagram profile picture by profile URL.','Paste Instagram profile URL...','View DP']",
            "if(type==='profile'){return profile(v)}return resolve(v)":"if(type==='dp'){return dpViewer(v)}let kind=urlType(v);if(kind!==type){let names={photo:'Photo',reels:'Reel',video:'Video',story:'Story'};msg('Please enter a valid '+(names[type]||type)+' URL.','#dc2626');return}return resolve(v)",
            "async function profile(input){let h=cleanHandle(input);if(!validUrl(input)){msg('Please paste a valid Instagram profile URL.','#dc2626');return}handle=h;load('Loading profile...');msg('Fetching public profile...');$('go').disabled=true;try{let d=await api('/api/profile?handle='+encodeURIComponent(h));renderProfile(d.data||d);msg('Profile loaded.','#16a34a');loadSection('posts')}catch(e){$('results').innerHTML='';msg(e.message||'Profile could not be loaded.','#dc2626')}finally{$('go').disabled=false;$('go').textContent='View Profile'}}":"async function dpViewer(input){if(urlType(input)!=='dp'){msg('Please enter a valid Instagram profile URL.','#dc2626');return}let b=$('go');b.disabled=true;b.textContent='Processing...';load('Loading profile picture...');try{let r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:input})}),d=await r.json();if(!r.ok)throw Error(d?.error?.message||d?.error||'Profile picture could not be loaded.');let ms=d?.data?.medias||d?.medias||[];let pic=d?.data?.thumbnail||d?.thumbnail||mediaUrl(ms[0]||{});if(!pic)throw Error('Profile picture could not be found.');let h='<div class=\"card\"><div class=\"head\"><h2>Instagram DP</h2><span class=\"muted\">Profile picture</span></div><img class=\"media\" style=\"max-width:320px;margin:auto\" src=\"'+esc(pic)+'\" alt=\"Instagram profile picture\"><div class=\"qualities\"><button class=\"btn\" onclick=\"fileDownload(0,\\''+encodeURIComponent(input)+'\\')\">⬇ Download DP</button></div></div>';$('results').innerHTML=h;msg('Profile picture ready.','#16a34a')}catch(e){$('results').innerHTML='';msg(e.message||'Profile picture could not be loaded.','#dc2626')}finally{b.disabled=false;b.textContent=CFG[type][3]}}"
          }
          for a,b in reps.items():
              if a not in s:
                  print('Missing expected text:', a[:80])
              s=s.replace(a,b)
          marker="function validUrl(v){try{let u=new URL(v);return /^https?:$/.test(u.protocol)&&/(^|\\.)instagram\\.com$/i.test(u.hostname)}catch(e){return false}}"
          add="""function validUrl(v){try{let u=new URL(v);return /^https?:$/.test(u.protocol)&&/(^|\\.)instagram\\.com$/i.test(u.hostname)}catch(e){return false}}\nfunction urlType(v){try{let p=new URL(v).pathname.split('/').filter(Boolean).map(x=>x.toLowerCase());if(!p.length)return'dp';if(p[0]==='p')return'photo';if(p[0]==='reel'||p[0]==='reels')return'reels';if(p[0]==='tv')return'video';if(p[0]==='stories')return'story';return'dp'}catch(e){return'unknown'}}"""
          if marker in s and 'function urlType(v)' not in s:
              s=s.replace(marker,add)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-dp-fix.yml
          git add index.html
          git commit -m "Add DP Viewer and strict Instagram URL validation"
          git push
