name: Use banner-style Monetag ads
on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace popup ads with banner zone
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('worker-wrapper.js')
          s = p.read_text()

          s = re.sub(
              r'const ads=`.*?`;let out=',
              '''const ads=`<script>(function(s){s.dataset.zone='11727439';s.src='https://nap5k.com/tag.min.js'})(document.documentElement.appendChild(document.createElement('script')))</script>`;let out=''',
              s,
              count=1,
              flags=re.S,
          )

          s = s.replace(
              'replaceAll("/akhisave-mark.svg",icon);',
              'replaceAll("/akhisave-mark.svg",icon).replace(/11717101/g,"11727439");'
          )
          p.write_text(s)
          PY

      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/banner-ads-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-wrapper.js .github/workflows/banner-ads-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Use banner-style Monetag ad zone'
          git push
