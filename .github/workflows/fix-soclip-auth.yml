name: Fix SoClip auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch worker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('worker.js')
          s = p.read_text()
          old = 'Authorization: `Bearer ${env.SOCLIP_API_KEY}`, "Content-Type": "application/json"'
          new = 'Authorization: `Bearer ${normalizeApiKey(env.SOCLIP_API_KEY)}`, "Content-Type": "application/json", "Accept": "application/json"'
          if s.count(old) != 2:
              raise SystemExit(f'Expected 2 SoClip auth headers, found {s.count(old)}')
          s = s.replace(old, new)
          marker = 'function isInstagramUrl(value) {'
          helper = '''function normalizeApiKey(value) {\n  return String(value || "").trim().replace(/^Bearer\\s+/i, "").replace(/^['\\\"]|['\\\"]$/g, "").trim();\n}\n\n'''
          if 'function normalizeApiKey(value)' not in s:
              if marker not in s:
                  raise SystemExit('Worker marker not found')
              s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js
          git commit -m "Normalize SoClip API key before requests"
          git rm .github/workflows/fix-soclip-auth.yml
          git commit -m "Remove one-time SoClip fix workflow"
          git push
