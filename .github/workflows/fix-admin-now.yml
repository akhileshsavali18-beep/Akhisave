name: Fix admin dashboard now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix admin dashboard') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore old detailed light UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='/* AkhiSave Premium Admin Theme */'
          if marker in s:
              a=s.index(marker)
              b=s.index('</style>',a)
              s=s[:a]+s[b:]
          logo='/* AkhiSave official logo asset */'
          if logo in s:
              a=s.index(logo)
              b=s.index('</style>',a)
              s=s[:a]+s[b:]
          if 'id="reset"' not in s:
              s=s.replace('<button id="save" class="btn save">Save Changes</button></div><div id="saveMessage"','<button id="save" class="btn save">Save Changes</button><button id="reset" class="btn secondary">Reset Defaults</button></div><div id="saveMessage"')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'Fix admin dashboard styling'
          git push
          git rm .github/workflows/fix-admin-now.yml
          git commit -m 'Remove temporary admin fix workflow'
          git push