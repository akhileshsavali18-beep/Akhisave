name: Apply Premium Admin Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply premium admin theme') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* AkhiSave Premium Admin Theme */
          :root{--bg:#070a12;--panel:#0d1422;--panel2:#101827;--line:#202b3f;--txt:#f7f8fc;--muted:#8b97ac;--p:#775cff;--pk:#ff3f8f;--or:#ff9d4d;--ok:#32d583}
          html,body{background:radial-gradient(700px 380px at 10% -5%,#6f52ff22,transparent 65%),radial-gradient(650px 380px at 95% 0,#ff3f8f18,transparent 62%),var(--bg)!important;color:var(--txt)!important}
          .topbar{background:#070a12e8!important;border-bottom:1px solid #ffffff0d!important;backdrop-filter:blur(18px);color:#fff!important}
          .brand{color:#fff!important;font-weight:950!important;letter-spacing:-.5px}.brand span{background:linear-gradient(90deg,#bcaeff,#ff83b5,#ffc078);-webkit-background-clip:text;color:transparent!important}
          .iconbtn{background:#111a2a!important;color:#fff!important;border:1px solid #ffffff0d!important;box-shadow:0 10px 30px #0003}
          .wrap{max-width:1180px;padding-top:86px}
          .card{background:linear-gradient(155deg,#111a2a,#0b111d)!important;border:1px solid #ffffff10!important;border-radius:20px!important;box-shadow:0 20px 60px #0005!important;color:var(--txt)!important}
          .muted,.label,.toolmeta,.small{color:var(--muted)!important}
          h1,h2,h3,b,strong{color:#f7f8fc!important}
          .stat{color:#fff!important}.section h2{letter-spacing:-.5px}
          .pill{background:#32d58312!important;color:#55dfa0!important;border:1px solid #32d5832b!important}
          .btn{background:#111a2a!important;color:#fff!important;border:1px solid #ffffff10!important}.btn.primary{background:linear-gradient(135deg,var(--p),var(--pk))!important;border:0!important}.btn.light{background:#ffffff08!important;color:#dbe1ec!important}
          .btn.danger{background:#ff3d4d12!important;color:#ff9a9f!important;border-color:#ff3d4d25!important}
          .field input,.field select,.field textarea{background:#0b111d!important;color:#fff!important;border:1px solid #ffffff12!important}.field input::placeholder,.field textarea::placeholder{color:#657189!important}
          .row,.toolrow{border-color:#ffffff0c!important}.drawerbox{background:#0b111d!important;color:#fff!important;border-right:1px solid #ffffff10}.drawer a{color:#aab4c6!important}.drawer a.active,.drawer a:hover{background:#775cff16!important;color:#c9bdff!important}
          .bottom{background:#080c15!important;border-top:1px solid #ffffff0d!important}.bottom button{color:#778399!important}.bottom button.active{color:#bcaeff!important}
          .chart .bar{background:linear-gradient(180deg,var(--p),var(--pk))!important}
          .empty{background:#0b111d!important;color:var(--muted)!important;border:1px solid #ffffff08}
          .toolicon{filter:saturate(1.15)}
          .switch{background:#30394a!important}.switch:checked{background:linear-gradient(135deg,var(--p),var(--pk))!important}
          .toast{background:#111a2a!important;border:1px solid #ffffff12!important;box-shadow:0 15px 45px #0007}
          #loginView .card{background:linear-gradient(155deg,#111a2a,#0b111d)!important}
          #loginView .brand:before{content:'A';display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;border-radius:11px;background:linear-gradient(135deg,var(--p),var(--pk),var(--or));color:#fff;font-size:18px;vertical-align:middle;box-shadow:0 10px 30px #775cff33}
          @media(max-width:560px){.wrap{padding-left:12px;padding-right:12px}.card{border-radius:18px!important}.topbar{height:64px}.brand{font-size:20px}}
          '''
          marker='</style>'
          if '/* AkhiSave Premium Admin Theme */' not in s:
              s=s.replace(marker,css+'\n'+marker,1)
          s=s.replace('SoClip API','SocialKit API').replace('SoClip key status','SocialKit key status').replace('Server-side SoClip','Server-side SocialKit')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit theme
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet || git commit -m 'Apply premium admin theme'
          git push
