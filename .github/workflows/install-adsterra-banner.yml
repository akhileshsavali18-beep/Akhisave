name: Install Adsterra 300x250 banners
on:
  push:
    branches: [main]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace Monetag popup injection with Adsterra banners
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('worker-wrapper.js')
          s = p.read_text()

          banner = '''<div class="akhisave-adsterra-top" style="width:100%;display:flex;justify-content:center;align-items:center;margin:18px auto 8px;min-height:250px;overflow:hidden"><div style="width:300px;height:250px"><script>atOptions = { 'key' : 'b5f10b469c2566d06ff288ac7dc9b5b2', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };</script><script src="https://www.highrevenueformat.com/b5f10b469c2566d06ff288ac7dc9b5b2/invoke.js"></script></div></div>'''

          middle = '''<div class="akhisave-adsterra-middle" style="width:100%;display:flex;justify-content:center;align-items:center;margin:24px auto;min-height:250px;overflow:hidden"><div style="width:300px;height:250px"><script>atOptions = { 'key' : 'b5f10b469c2566d06ff288ac7dc9b5b2', 'format' : 'iframe', 'height' : 250, 'width' : 300, 'params' : {} };</script><script src="https://www.highrevenueformat.com/b5f10b469c2566d06ff288ac7dc9b5b2/invoke.js"></script></div></div>'''

          # Remove the old injected Monetag/Direct-Link block.
          s = re.sub(r'const ads=`.*?`;let out=', 'const ads=``;let out=', s, count=1, flags=re.S)

          # Put the Adsterra banner immediately below the site header where present.
          s = s.replace('</header>', '</header>' + banner, 1)

          # Turn the existing homepage/result advertisement placeholder into an in-content banner.
          s = s.replace('<div class="ad">ADVERTISEMENT</div>', middle, 1)

          p.write_text(s)
          PY

      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/install-adsterra-banner.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker-wrapper.js .github/workflows/install-adsterra-banner.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Add Adsterra 300x250 top and in-content banners'
          git push
