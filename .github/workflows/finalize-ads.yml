name: Finalize AkhiSave ad placement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update ad placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('worker-wrapper.js')
          s=p.read_text()
          new="""const ads=`<script src=\"https://5gvci.com/act/files/tag.min.js?z=11727457\" data-cfasync=\"false\" async></script><script>(function(s){s.dataset.zone='11727165',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement,document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script><script>document.addEventListener('DOMContentLoaded',()=>{document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;const text=(el.textContent||'').trim().toLowerCase();if(!/download/.test(text))return;window.open('https://omg10.com/4/11727445','_blank','noopener');},{capture:true})});</script>`;"""
          s2=re.sub(r"const ads=`.*?`;", new, s, count=1, flags=re.S)
          if s2==s: raise SystemExit('ad block not found')
          p.write_text(s2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-ads.yml
          git add worker-wrapper.js .github/workflows/finalize-ads.yml
          git commit -m "Place Monetag ads by purpose" || exit 0
          git push
