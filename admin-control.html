<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AkhiSave Control Center</title><meta name="robots" content="noindex,nofollow"><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;padding:20px;margin:14px 0;border-radius:16px;border:1px solid #e3e7ee}.row{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.switch{width:48px;height:26px}.btn{padding:11px 16px;border:0;border-radius:9px;background:#172033;color:white;font-weight:700}.input{width:100%;padding:11px;border:1px solid #ccd3df;border-radius:9px;box-sizing:border-box}.muted{color:#687386}.ok{color:#18753c;font-weight:700}.bad{color:#b42318;font-weight:700}@media(max-width:600px){.row{align-items:flex-start}}</style></head><body><div class="wrap"><h1>AkhiSave Control Center</h1><p class="muted">Central admin controls. API secrets are never displayed here.</p><div class="card"><h2>System Status</h2><div id="status">Checking…</div></div><div class="card"><h2>Website</h2><div class="row"><span>Maintenance Mode</span><input id="maintenance" class="switch" type="checkbox"></div><label>Announcement / Banner</label><p><input id="announcement" class="input" maxlength="180" placeholder="Announcement"></p></div><div class="card"><h2>Instagram Tools</h2><div class="row"><span>Photo Downloader</span><input id="photo" class="switch" type="checkbox"></div><div class="row"><span>Reels Downloader</span><input id="reels" class="switch" type="checkbox"></div><div class="row"><span>Video Downloader</span><input id="video" class="switch" type="checkbox"></div><div class="row"><span>Story Downloader</span><input id="story" class="switch" type="checkbox"></div><div class="row"><span>DP Viewer</span><input id="profile" class="switch" type="checkbox"></div></div><div class="card"><h2>Ads</h2><div class="row"><span>Monetag In-Page Push</span><input id="monetag" class="switch" type="checkbox"></div><p><label>Monetag Zone ID</label><input id="zone" class="input" inputmode="numeric"></p></div><div class="card"><h2>SEO</h2><p><label>Homepage Title</label><input id="title" class="input"></p><p><label>Meta Description</label><input id="description" class="input"></p></div><button id="save" class="btn">Save All Changes</button><p id="msg" class="muted"></p></div><script>const $=id=>document.getElementById(id);async function api(p,o={}){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let d={};try{d=await r.json()}catch{}return{ok:r.ok,data:d}}function setv(id,v){$(id).type==='checkbox'?$(id).checked=!!v:$(id).value=v??''}function fill(s){setv('maintenance',s.maintenance);setv('announcement',s.announcement);Object.keys(s.tools||{}).forEach(k=>$(k)&&setv(k,s.tools[k]));setv('monetag',s.ads?.monetag);setv('zone',s.ads?.zone);setv('title',s.seo?.title);setv('description',s.seo?.description)}function read(){return{maintenance:$('maintenance').checked,announcement:$('announcement').value,tools:{photo:$('photo').checked,reels:$('reels').checked,video:$('video').checked,story:$('story').checked,profile:$('profile').checked,youtube:false,facebook:false,tiktok:false},ads:{monetag:$('monetag').checked,zone:$('zone').value},seo:{title:$('title').value,description:$('description').value}}}async function load(){let s=await api('/api/admin/status');if(!s.ok){location.href='/admin.html';return}$('status').innerHTML='<span class="ok">Admin session active · SoClip configured: '+(s.data.downloader?'YES':'NO')+'</span>';let r=await api('/api/admin/settings');if(r.ok)fill(r.data.settings)}$('save').onclick=async()=>{let r=await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(read())});$('msg').textContent=r.ok?'Saved successfully.':'Save failed: '+(r.data.error||'Unknown error')};load();</script></body></html>
